name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: swiftdrop
          POSTGRES_PASSWORD: swiftdrop
          POSTGRES_DB: swiftdrop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swiftdrop -d swiftdrop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://swiftdrop:swiftdrop@localhost:5432/swiftdrop_test
      APP_URL: http://localhost:5173
      OSRM_URL: http://localhost:5000
      JWT_ACCESS_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:5173/api/auth/google/callback
      YANDEX_CLIENT_ID: ci-yandex-client-id
      YANDEX_CLIENT_SECRET: ci-yandex-client-secret
      YANDEX_CALLBACK_URL: http://localhost:5173/api/auth/yandex/callback
      STRIPE_SECRET_KEY: sk_test_ci_only_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_only_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:fsd
      - run: npm run typecheck
      - run: npm run build
